# Producción contra su servidor PostgreSQL 16 existente: aplicación + Caddy (HTTPS automático) + respaldos diarios.
#   1. Prepare la base con deploy/postgres/01-create-database.sql (ver docs/DEPLOYMENT.md)
#   2. Cree .env.prod con DOMAIN, ACME_EMAIL, DATABASE_URL (rol planeacion_app) y MIGRATE_DATABASE_URL (rol planeacion_owner)
#   3. docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm migrate
#   4. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Si PostgreSQL corre en el mismo equipo que Docker, use host.docker.internal como host en las URL.
services:
  app:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL (rol planeacion_app, sslmode=require o verify-full)}
      DB_AUTO_MIGRATE: "false"
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # Tarea puntual: aplica migraciones con el rol propietario (antes de cada despliegue).
  migrate:
    build: .
    profiles: ["tools"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?Defina MIGRATE_DATABASE_URL (rol planeacion_owner)}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "--disable-warning=ExperimentalWarning", "dist/cli/migrate.js"]

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  # Respaldo diario con pg_dump 16 (formato custom); conserva BACKUP_KEEP_DAYS días.
  backup:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?Defina MIGRATE_DATABASE_URL}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/planeacion-$$(date -u +%Y%m%dT%H%M%SZ).dump
          if pg_dump --format=custom --no-owner --no-privileges --dbname="$$DATABASE_URL" --file="$$f"; then echo "respaldo: $$f"; else echo "respaldo fallido"; rm -f "$$f"; fi
          find /backups -name 'planeacion-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
